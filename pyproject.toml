[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guestgraph"
version = "0.1.0"
description = "Identity resolution and audience activation for restaurant transaction data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Thejas Vijaykumar Koiloorkar"}]
dependencies = [
  "duckdb>=1.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.5",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.11"]
snowflake = ["snowflake-connector-python>=3.6"]
aws = ["boto3>=1.34"]

[project.scripts]
guestgraph = "guestgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guestgraph = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
