AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: guestgraph - rebuild guest audiences when transaction files land in S3

Parameters:
  BucketName:
    Type: String
    Description: Name for the data bucket (must be globally unique)

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BuildAudiences:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: lambda_handler.handler
      CodeUri: build/
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          OUTPUT_PREFIX: audiences
      Policies:
        - S3CrudPolicy: {BucketName: !Ref BucketName}
      Events:
        NewTransactions:
          Type: S3
          Properties:
            Bucket: !Ref DataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - {Name: prefix, Value: incoming/}
                  - {Name: suffix, Value: transactions.csv}
